<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfbe7e"/>
      <stop offset="50%" stop-color="#c5a059"/>
      <stop offset="100%" stop-color="#9d7c38"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b3b33"/>
      <stop offset="100%" stop-color="#041713"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="100" cy="100" r="94" fill="url(#emeraldGrad)" stroke="url(#goldGrad)" stroke-width="3"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#c5a059" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.6"/>
  
  <!-- Faceted Resin Crystal Silhouette -->
  <polygon points="100,28 148,65 130,126 100,165 70,126 52,65" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.4"/>
  <polygon points="100,38 138,70 124,120 100,150 76,120 62,70" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.7"/>
  <polygon points="100,50 128,75 118,112 100,135 82,112 72,75" fill="rgba(197, 160, 89, 0.12)" stroke="url(#goldGrad)" stroke-width="1.8"/>

  <!-- Center 'RA' Monogram -->
  <text x="100" y="112" font-family="'Cinzel', serif" font-size="44" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">RA</text>
  <text x="100" y="132" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="500" fill="#dfbe7e" text-anchor="middle" letter-spacing="6">RESIN AURA</text>
</svg>

